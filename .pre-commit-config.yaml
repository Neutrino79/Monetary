# Install once (installs the pre-commit, commit-msg and pre-push hooks):
#     python -m pip install -r backend/requirements-dev.txt && pre-commit install
# Run on demand: pre-commit run --all-files
# The web hook needs `npm ci` to have been run in web/.
default_install_hook_types: [pre-commit, commit-msg, pre-push]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-yaml
      - id: check-json
        files: ^backend/monetary/    # web/tsconfig*.json allow comments, so only check the backend's JSON
      - id: check-merge-conflict
      - id: detect-private-key
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: no-commit-to-branch    # work on a branch, never commit straight to main
        args: [--branch, main]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.10
    hooks:
      - id: ruff-check             # config: backend/pyproject.toml (also applied to scripts/)
        args: [--config, backend/pyproject.toml]

  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets         # scans for committed secrets; known false positives live in .secrets.baseline
        args: [--baseline, .secrets.baseline]
        exclude: package-lock\.json$

  - repo: local
    hooks:
      - id: web-lint
        name: oxlint (web)
        entry: bash -c 'cd web && npm run lint'
        language: system
        files: ^web/
        pass_filenames: false

      - id: commit-message
        name: commit message format (Conventional Commits)
        entry: python scripts/commit_lint.py msg --local
        language: python
        stages: [commit-msg]

      - id: branch-name
        name: branch name format (<type>/<kebab-case>)
        entry: python scripts/commit_lint.py branch --current
        language: python
        always_run: true
        pass_filenames: false
        stages: [pre-push]
