name: Feature request
description: Propose a new capability or an improvement
title: "feat: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
    validations: {required: true}
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Include any API, schema or UI changes you expect.
    validations: {required: true}
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
