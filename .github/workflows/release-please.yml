name: Release

# Keeps a "chore(release): X.Y.Z" PR open that bumps the version and updates CHANGELOG.md from the
# Conventional Commit history; merging it tags the release. Needs the repository setting
# Settings -> Actions -> General -> "Allow GitHub Actions to create and approve pull requests".
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: .github/release-please-config.json
          manifest-file: .github/.release-please-manifest.json
