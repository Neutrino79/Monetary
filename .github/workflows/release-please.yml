name: Release

# Keeps a "chore(release): X.Y.Z" PR open that bumps the version and updates CHANGELOG.md from the
# Conventional Commit history; merging it tags the release. Needs the repository setting
# Settings -> Actions -> General -> "Allow GitHub Actions to create and approve pull requests".
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: googleapis/release-please-action@a02a34c4d625f9be7cb89156071d8567266a2445 # v4.2.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
