name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m compileall -q monetary
      - run: python -m pytest tests -q --cov=monetary --cov-report=term-missing

  frontend:
    name: Frontend (production-app)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: production-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: production-app/package-lock.json
      - uses: actions/setup-python@v5   # the integration suite boots the real backend
        with:
          python-version: "3.12"
      - run: python -m pip install -r ../requirements.txt
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run test:integration
